name: Data freshness

# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity; a push, or enabling the workflow again on the Actions tab, starts it again.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Live data is valid and fresh
        run: python scripts/check_live.py
