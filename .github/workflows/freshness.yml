name: Data freshness
run-name: ${{ inputs.test_alert && 'Weekly alert test (fails on purpose)' || 'Data freshness' }}

# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity; a push, or enabling the workflow again on the Actions tab, starts it again.
# The stale-data Worker (watchdog/) also starts this workflow every hour, since GitHub delays
# scheduled runs at busy times.
# "Collector and site" failing means our collector or site is broken. "Price sources" failing
# means a zone has no current price, or a provider gap has reached 6 hours or its morning
# reminder; gaps that other providers cover show as warnings on the run page.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Fail on purpose, to show that a failed check still reaches the inbox
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collector:
    name: Collector and site
    runs-on: ubuntu-latest
    steps:
      - name: Weekly alert test
        if: ${{ inputs.test_alert }}
        run: |
          echo "::error::Weekly test from the stale-data Worker. This run fails on purpose to show that a failed check still sends its email. Nothing needs doing."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Collector and site data are valid and fresh
        run: python scripts/check_live.py --part collector

  sources:
    name: Price sources
    needs: collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Every zone has a current price
        run: python scripts/check_live.py --part sources
