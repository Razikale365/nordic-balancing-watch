name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Fixture data follows the contract
        run: python scripts/check_data.py tests/fixtures/data

      # Test-only dependency, installed from its lockfile: the site itself stays plain HTML,
      # CSS and JavaScript.
      - name: Install Playwright and Chromium
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser tests (page without JavaScript, without data, and with data)
        run: node --test tests/browser/*.test.mjs
