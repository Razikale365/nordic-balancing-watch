name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Fixture data follows the contract
        run: python scripts/check_data.py tests/fixtures/data

      # Test-only dependency, installed from its lockfile: the site itself stays plain HTML,
      # CSS and JavaScript.
      - name: Install Playwright and Chromium
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser tests (page without JavaScript, without data, and with data)
        run: node --test tests/browser/*.test.mjs
