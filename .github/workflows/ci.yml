name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Fixture data follows the contract
        run: python scripts/check_data.py tests/fixtures/data

      # Test-only dependency, installed from its lockfile: the site itself stays plain HTML,
      # CSS and JavaScript.
      - name: Install Playwright and Chromium
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser tests (page without JavaScript, without data, and with data)
        run: node --test tests/browser/*.test.mjs

  # Deploys only after every test above has passed, and only from main (or when started by hand).
  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: nbw-pages-deploy
      cancel-in-progress: false
    env:
      # Only whether the secrets are set; the token itself goes only to the steps that use it.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test the functions
        run: node --test tests/*.test.mjs

      - name: Apply D1 migrations
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply nbw-waitlist --remote

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=nordic-balancing-watch --branch=main

      - name: Skip deploy
        if: ${{ env.HAS_CLOUDFLARE != 'true' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy"
