name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Python tests
        run: python -m pytest -q

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Fixture data follows the contract
        run: python scripts/check_data.py tests/fixtures/data
