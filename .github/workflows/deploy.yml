name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nbw-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the data branch into site/data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            mkdir -p site/data
            git archive FETCH_HEAD | tar -x -C site/data
            echo "data branch extracted into site/data"
          else
            echo "no data branch yet; deploying without data files"
          fi

      - name: Validate the data files
        run: |
          if [ -f site/data/summary.json ]; then
            python scripts/check_data.py site/data
          else
            echo "no data files; nothing to validate"
          fi

      - name: Apply D1 migrations and deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply nbw-waitlist --remote
            pages deploy site --project-name=nordic-balancing-watch --branch=main

      - name: Skip deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy"
